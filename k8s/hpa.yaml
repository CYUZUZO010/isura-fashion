apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: isura-backend-hpa}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: isura-backend}
  minReplicas: 3
  maxReplicas: 5
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
