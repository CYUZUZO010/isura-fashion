server:
  port: ${port:8081}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/isura_fashion}
    username: ${DB_USER:isura}
    password: ${DB_PASSWORD:isura_dev_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
app:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-123456789}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
